<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#11150f"><title>Crossmaglen: Open World</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10140f;color:#fff;font-family:system-ui,Arial;touch-action:none}#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;background:#263b2b}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:2px 2px #000}#brand{position:absolute;left:12px;top:10px;font-weight:1000;font-size:clamp(13px,2.6vw,20px);letter-spacing:1px;color:#f7e7a0}#stats{position:absolute;right:12px;top:10px;text-align:right;font-weight:800;font-size:clamp(12px,2.5vw,17px);line-height:1.6}#mission{position:absolute;left:12px;top:48px;max-width:58vw;background:#111d;padding:7px 10px;border:1px solid #e7d38b;border-radius:4px;font-size:12px}#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#111e;border:1px solid #e7d38b;padding:8px 14px;border-radius:4px;font-weight:800;opacity:0;transition:opacity .2s;text-align:center}#controls{position:fixed;inset:0;pointer-events:none}.pad{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));width:140px;height:140px;pointer-events:auto;touch-action:none}.left{left:16px}.right{right:16px}.stick{position:absolute;inset:0;border:2px solid #ffffff55;border-radius:50%;background:#0005}.nub{position:absolute;width:54px;height:54px;left:43px;top:43px;border-radius:50%;background:#d8d4bdcc;border:2px solid #fff;box-shadow:0 2px 8px #000}.action{position:absolute;pointer-events:auto;right:174px;bottom:max(28px,env(safe-area-inset-bottom));border:2px solid #fff;background:#a52d25;color:white;font-weight:900;border-radius:50%;width:65px;height:65px;font-size:12px;box-shadow:0 3px 0 #50140f}.action.secondary{right:174px;bottom:max(103px,calc(env(safe-area-inset-bottom) + 103px));background:#344c8b}.smallhint{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff9;white-space:nowrap}@media(min-width:800px){.pad{width:160px;height:160px}.action{right:200px}.action.secondary{right:200px}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div id="brand">CROSSMAGLEN <span style="color:#fff">: OPEN WORLD</span></div><div id="mission">MISSION: <b id="missionText">Find the green marker</b></div><div id="stats">£<span id="cash">250</span><br>WANTED <span id="stars">☆☆☆☆☆</span><br><span id="vehicle">ON FOOT</span></div><div id="toast"></div></div><div id="controls"><div class="pad left" id="movePad"><div class="stick"></div><div class="nub"></div></div><button class="action" id="action">ENTER</button><button class="action secondary" id="run">RUN</button><div class="smallhint">LEFT: MOVE / STEER · ENTER: GET IN / OUT · RUN: ACCELERATE</div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const TILE=48, world={w:3000,h:2600};let roads=[],buildings=[],trees=[],water=[],paths=[];
// A fictionalised, Crossmaglen-inspired layout: compact town centre, radial roads and rural lanes.
function road(x1,y1,x2,y2,width=34){roads.push({x1,y1,x2,y2,width})}
road(150,1300,2850,1300,54);road(1500,100,1500,2500,52);road(400,700,2600,1950,30);road(300,2050,2650,500,30);road(700,1300,700,350,27);road(2250,1300,2250,2350,27);road(900,850,2050,850,25);road(950,1750,2050,1750,25);road(1100,1050,1100,1550,22);road(1850,1050,1850,1550,22);road(1500,850,1500,1750,24);
// Rural lanes and loops
road(1500,2500,1250,2550,24);road(1250,2550,700,2350,24);road(700,2350,300,2050,24);road(1500,100,1800,160,23);road(1800,160,2450,350,23);road(2450,350,2850,500,23);road(150,1300,250,900,24);road(250,900,400,700,24);road(2850,1300,2780,1750,24);road(2780,1750,2650,1950,24);
function nearRoad(x,y,margin=28){return roads.some(r=>{let dx=r.x2-r.x1,dy=r.y2-r.y1,t=Math.max(0,Math.min(1,((x-r.x1)*dx+(y-r.y1)*dy)/(dx*dx+dy*dy)));return Math.hypot(x-(r.x1+t*dx),y-(r.y1+t*dy))<r.width/2+margin})}
// town blocks
for(let y=920;y<=1660;y+=112)for(let x=820;x<=2180;x+=118){if(Math.abs(x-1500)<95||Math.abs(y-1300)<88)continue;let bx=x+((x+y)%3)*8,by=y+((x*2+y)%2)*8;if(!nearRoad(bx+35,by+30,7))buildings.push({x:bx,y:by,w:54+(x%3)*8,h:48+(y%2)*12,c:['#a69a7c','#b5a58a','#8f9b86','#b8b0a0'][Math.floor((x+y)%4)]})}
// Named landmarks
buildings.push({x:1410,y:1150,w:170,h:75,c:'#b79d72',name:'MARKET SQUARE'});buildings.push({x:1740,y:910,w:115,h:70,c:'#9eaa91',name:'GARAGE'});buildings.push({x:930,y:1430,w:105,h:70,c:'#9d8d79',name:'LOCAL SHOP'});buildings.push({x:1960,y:1430,w:125,h:75,c:'#b5a58a',name:'COMMUNITY HALL'});
for(let i=0;i<210;i++){let x=(i*173)%world.w,y=(i*293+71)%world.h;if(!nearRoad(x,y,38)&&!buildings.some(b=>x>b.x-25&&x<b.x+b.w+25&&y>b.y-25&&y<b.y+b.h+25))trees.push({x,y,r:7+(i%9)})}
const player={x:1500,y:1360,a:0,speed:0,inCar:false,car:null};let cash=250,wanted=0,heat=0,mission=0,toastTimer=0;const cars=[],peds=[],police=[];const carColors=['#bd3930','#315f9a','#d4b64e','#dedbd0','#497b53','#784d8d','#25282b'];
function addCar(x,y,a,color,traffic=false){cars.push({x,y,a,speed:traffic?0.8+Math.random()*0.7:0,color,a0:a,traffic,occupied:false,turn:0})}
for(let i=0;i<28;i++){let r=roads[i%roads.length],t=Math.random(),x=r.x1+(r.x2-r.x1)*t,y=r.y1+(r.y2-r.y1)*t;addCar(x,y,Math.atan2(r.y2-r.y1,r.x2-r.x1)+(i%2?Math.PI:0),carColors[i%carColors.length],true)}
for(let i=0;i<48;i++){let x=750+Math.random()*1500,y=880+Math.random()*850;if(!nearRoad(x,y,10))peds.push({x,y,a:Math.random()*6.28,s:0.35+Math.random()*.35,wait:Math.random()*100,color:['#d8b28a','#6da4ba','#b76e63','#c9c7a4','#474e68'][i%5]})}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let stick={x:0,y:0},run=false;function bindPad(el){let nub=el.querySelector('.nub'),active=false;function move(e){let r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=48;if(len>max){dx*=max/len;dy*=max/len}stick.x=dx/max;stick.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`}el.addEventListener('pointerdown',e=>{active=true;el.setPointerCapture(e.pointerId);move(e)});el.addEventListener('pointermove',e=>{if(active)move(e)});function end(){active=false;stick.x=stick.y=0;nub.style.transform=''}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}bindPad(document.getElementById('movePad'));document.getElementById('run').addEventListener('pointerdown',()=>run=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('run').addEventListener(ev,()=>run=false));
function say(s){let t=document.getElementById('toast');t.textContent=s;t.style.opacity=1;toastTimer=150}function nearestCar(){let best=null,d=65;for(let c of cars){let n=Math.hypot(c.x-player.x,c.y-player.y);if(n<d&&!c.occupied){d=n;best=c}}return best}
function action(){if(player.inCar){player.car.occupied=false;player.x=player.car.x+Math.cos(player.car.a+1.5)*30;player.y=player.car.y+Math.sin(player.car.a+1.5)*30;player.car=null;player.inCar=false;say('You got out');}else{let c=nearestCar();if(c){c.occupied=true;c.traffic=false;player.car=c;player.inCar=true;player.x=c.x;player.y=c.y;say('Vehicle acquired');}else say('No vehicle nearby');}}document.getElementById('action').addEventListener('click',action);
function distRoad(x,y){let d=1e9;for(let r of roads){let dx=r.x2-r.x1,dy=r.y2-r.y1,t=Math.max(0,Math.min(1,((x-r.x1)*dx+(y-r.y1)*dy)/(dx*dx+dy*dy)));d=Math.min(d,Math.hypot(x-(r.x1+t*dx),y-(r.y1+t*dy)))}return d}
function update(){let ix=stick.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),iy=stick.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);if(player.inCar){let c=player.car;if(run||keys.w||keys.arrowup)c.speed=Math.min(5.8,c.speed+.12);else if(keys.s||keys.arrowdown)c.speed=Math.max(-2.5,c.speed-.12);else c.speed*=.96;c.a+=ix*.055*(Math.abs(c.speed)+.5)*(c.speed<0?-1:1);c.x+=Math.cos(c.a)*c.speed;c.y+=Math.sin(c.a)*c.speed;if(distRoad(c.x,c.y)>c.traffic?0:0){}if(c.x<20||c.y<20||c.x>world.w-20||c.y>world.h-20)c.speed*=-.3;player.x=c.x;player.y=c.y;if(Math.abs(c.speed)>2&&Math.random()<.002){wanted=Math.min(5,wanted+1);heat=900;say('Police alerted!')}}else{let mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag}let sp=run||keys.shift?2.7:1.55;player.x=Math.max(10,Math.min(world.w-10,player.x+ix*sp));player.y=Math.max(10,Math.min(world.h-10,player.y+iy*sp));if(mag>.1)player.a=Math.atan2(iy,ix)}
for(let c of cars){if(c.traffic&&!c.occupied){c.x+=Math.cos(c.a)*c.speed;c.y+=Math.sin(c.a)*c.speed;if(c.x<80||c.x>world.w-80||c.y<80||c.y>world.h-80){c.a+=Math.PI;c.x=Math.max(100,Math.min(world.w-100,c.x));c.y=Math.max(100,Math.min(world.h-100,c.y))}}}
for(let p of peds){p.wait--;if(p.wait<0){p.a+=(Math.random()-.5)*.3;p.wait=40+Math.random()*100}let nx=p.x+Math.cos(p.a)*p.s,ny=p.y+Math.sin(p.a)*p.s;if(distRoad(nx,ny)<12){p.x=nx;p.y=ny}else p.a+=Math.PI*.7}
if(wanted>0){heat--;if(heat<=0)wanted=Math.max(0,wanted-1);if(Math.random()<.004*wanted&&police.length< wanted){police.push({x:player.x+(Math.random()-.5)*550,y:player.y-400,a:Math.PI/2,s:1.6+wanted*.25})}}for(let p of police){let a=Math.atan2(player.y-p.y,player.x-p.x);p.a=a;p.x+=Math.cos(a)*p.s;p.y+=Math.sin(a)*p.s;if(Math.hypot(player.x-p.x,player.y-p.y)<28){cash=Math.max(0,cash-30);wanted=0;heat=0;police.length=0;say('Busted! Fine £30')}}
// mission marker / pickup
let target=[{x:1500,y:1150,label:'Market Square'},{x:1800,y:945,label:'Garage'},{x:980,y:1470,label:'Local Shop'}][mission%3];if(Math.hypot(player.x-target.x,player.y-target.y)<65){cash+=100;mission++;say('Mission complete! +£100')}
document.getElementById('cash').textContent=cash;document.getElementById('stars').textContent='★'.repeat(wanted)+'☆'.repeat(5-wanted);document.getElementById('vehicle').textContent=player.inCar?'IN VEHICLE':'ON FOOT';document.getElementById('action').textContent=player.inCar?'EXIT':'ENTER';document.getElementById('missionText').textContent='Visit '+target.label+' for £100';if(toastTimer>0&&--toastTimer===0)document.getElementById('toast').style.opacity=0;
}
function draw(){let camX=Math.max(0,Math.min(world.w-W,player.x-W/2)),camY=Math.max(0,Math.min(world.h-H,player.y-H/2));ctx.fillStyle='#526d45';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-camX,-camY);
// fields
ctx.fillStyle='#66834e';for(let x=0;x<world.w;x+=160)for(let y=0;y<world.h;y+=150){if((x/160+y/150|0)%3===0){ctx.fillStyle='#718b55';ctx.fillRect(x,y,150,140)}else{ctx.fillStyle='#587947';ctx.fillRect(x,y,150,140)}}
// water / drainage
ctx.strokeStyle='#477d91';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(80,400);ctx.bezierCurveTo(650,520,800,300,1200,520);ctx.bezierCurveTo(1750,800,2200,450,2900,650);ctx.stroke();
// trees
for(let t of trees){ctx.fillStyle='#304c2c';ctx.fillRect(t.x-t.r,t.y-t.r,t.r*2,t.r*2);ctx.fillStyle='#42683a';ctx.fillRect(t.x-t.r+3,t.y-t.r+2,t.r*2-6,t.r*2-6)}
// roads
for(let r of roads){ctx.strokeStyle='#363a38';ctx.lineWidth=r.width+8;ctx.lineCap='butt';ctx.beginPath();ctx.moveTo(r.x1,r.y1);ctx.lineTo(r.x2,r.y2);ctx.stroke();ctx.strokeStyle='#777a70';ctx.lineWidth=r.width;ctx.beginPath();ctx.moveTo(r.x1,r.y1);ctx.lineTo(r.x2,r.y2);ctx.stroke();ctx.strokeStyle='#c5b989';ctx.lineWidth=2;ctx.setLineDash([14,14]);ctx.beginPath();ctx.moveTo(r.x1,r.y1);ctx.lineTo(r.x2,r.y2);ctx.stroke();ctx.setLineDash([])}
// buildings
for(let b of buildings){ctx.fillStyle='#30332d';ctx.fillRect(b.x+4,b.y+5,b.w,b.h);ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#5d5b4d';ctx.fillRect(b.x+4,b.y+4,b.w-8,7);ctx.fillStyle='#4c5b5b';for(let wx=b.x+10;wx<b.x+b.w-5;wx+=20)ctx.fillRect(wx,b.y+17,8,9);if(b.name){ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.fillText(b.name,b.x,b.y-5)}}
// mission marker
let target=[{x:1500,y:1150},{x:1800,y:945},{x:980,y:1470}][mission%3];ctx.strokeStyle='#ffe45c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(target.x,target.y,24+Math.sin(Date.now()/160)*5,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe45c';ctx.fillRect(target.x-3,target.y-3,6,6);
// pedestrians
for(let p of peds){ctx.fillStyle='#171916';ctx.fillRect(p.x-5,p.y-3,11,13);ctx.fillStyle=p.color;ctx.fillRect(p.x-4,p.y-7,9,9);ctx.fillStyle='#e2c09a';ctx.fillRect(p.x-3,p.y-11,7,6)}
// cars
for(let c of cars){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);ctx.fillStyle='#151816';ctx.fillRect(-17,-10,36,22);ctx.fillStyle=c.color;ctx.fillRect(-15,-9,30,18);ctx.fillStyle='#a8c4c7';ctx.fillRect(-5,-7,10,14);ctx.fillStyle='#e6d69c';ctx.fillRect(11,-7,3,4);ctx.fillRect(11,4,3,4);ctx.restore()}
for(let p of police){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='#161b23';ctx.fillRect(-18,-10,36,21);ctx.fillStyle='#d8d8d2';ctx.fillRect(-15,-8,30,17);ctx.fillStyle='#c33';ctx.fillRect(-5,-10,6,4);ctx.fillStyle='#39b8e8';ctx.fillRect(1,-10,6,4);ctx.restore()}
// player
if(!player.inCar){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.a);ctx.fillStyle='#141714';ctx.fillRect(-7,-7,14,15);ctx.fillStyle='#e4c09a';ctx.fillRect(-5,-11,10,8);ctx.fillStyle='#477ca4';ctx.fillRect(-6,-3,12,9);ctx.restore()}
ctx.restore();drawMini();}
function drawMini(){let mw=112,mh=96,x=W-mw-12,y=H-mh-15;ctx.globalAlpha=.85;ctx.fillStyle='#101510';ctx.fillRect(x,y,mw,mh);ctx.strokeStyle='#d7d0a0';ctx.strokeRect(x,y,mw,mh);ctx.save();ctx.beginPath();ctx.rect(x+3,y+3,mw-6,mh-6);ctx.clip();ctx.translate(x+3,y+3);ctx.scale((mw-6)/world.w,(mh-6)/world.h);ctx.strokeStyle='#8b8b80';for(let r of roads){ctx.lineWidth=Math.max(2,r.width);ctx.beginPath();ctx.moveTo(r.x1,r.y1);ctx.lineTo(r.x2,r.y2);ctx.stroke()}ctx.fillStyle='#f5e17b';ctx.fillRect(player.x-20,player.y-20,40,40);ctx.restore();ctx.globalAlpha=1}
function loop(){update();draw();requestAnimationFrame(loop)}say('Welcome to Crossmaglen! Find the yellow marker.');loop();
})();
</script></body></html>
